name: Deploy Application

on:
  workflow_run:
    branches: ['production']
    workflows: ['Test Application']
    types:
      - completed

jobs:
  deploy:
    name: Deploy Application
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Forge
        run: curl ${{ secrets.FORGE_HOOK }}
