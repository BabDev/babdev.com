allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
overrides:
  # fontless@0.2.1 (pinned by @nuxt/fonts 0.14.0) requires esbuild ^0.27.0, which is
  # affected by GHSA-g7r4-m6w7-qqqr. The app itself is on @nuxt/fonts 1.x, but the old
  # line still arrives through nuxtseo-devtools-host -> nuxtseo-layer-devtools -> @nuxt/ui,
  # so force the patched esbuild line and dedupe on it until that chain moves.
  esbuild@^0.27.0: ^0.28.2
